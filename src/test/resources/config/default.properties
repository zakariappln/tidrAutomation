# Committed defaults for every key. Override order (highest first):
#   -Dkey=value  >  env var KEY (dots->underscores, upper-case)  >  config/<env>.properties  >  this file
# Selection: -Denv=staging|uat|prod (or TEST_ENV). Never put real hosts or secrets here.
env=staging

# --- targets: defined per environment in config/<env>.properties; these are fail-safe placeholders ---
base.url=https://REPLACE-ME-ui.invalid
api.base.url=https://REPLACE-ME-api.invalid

# --- browser ---
browser=chromium
headless=true
slow.mo.ms=0
viewport.width=1440
viewport.height=900
locale=en-US

# --- timeouts (ms) ---
timeout.action.ms=10000
timeout.navigation.ms=30000
timeout.expect.ms=7000
api.timeout.ms=15000

# --- artifacts: off | on | on-failure | retain-on-failure ---
trace.mode=on-failure
video.mode=on-failure
screenshot.mode=on-failure

# --- plain TestNG retries (Cucumber scenarios are never retried) ---
retry.count=1

# --- production guard: prod refuses to run unless -Dprod.confirm=true / PROD_CONFIRM=true ---
prod.confirm=false

# --- authentication (credentials only via env vars: AUTH_USERNAME / AUTH_PASSWORD, per role AUTH_<ROLE>_USERNAME / AUTH_<ROLE>_PASSWORD) ---
auth.username=
auth.password=
# Login host; blank = same as api.base.url
auth.base.url=
# Login endpoint path and where the JWT sits in the login response (JSON Pointer). Placeholders: confirm against Swagger.
auth.login.path=/api/Auth/Login
auth.token.json.pointer=/data/token
# Known-expired JWT for negative tests (AUTH_EXPIRED_TOKEN)
auth.expired.token=

# --- UI session reuse (StorageStateManager): one real login per role, saved as
#     <auth.state.dir>/<env>/<role>.json and reused by later runs while younger than the max age
#     and still accepted by the app. ThreatIDR sessions live 15 min from the last request, so every
#     reuse re-signs the saved cookie and a session in use is refreshed every refresh.minutes.
#     Delete the file (or call StorageStateManager.invalidate) to force a login.
auth.state.dir=.auth-state
auth.state.max.age.minutes=14
auth.state.refresh.minutes=10

# --- soft checks: true = verification steps record failures and the scenario continues (failed at the end);
#     false = the first failing check stops the scenario. Override with -Dsoft.checks=true / SOFT_CHECKS=true.
soft.checks=false

# --- DNS resolution target (see core/dns/DnsClient): the nameserver to query directly for RPZ
# enforcement checks (Blocked/Allowed Domains), bypassing the host's system resolver. No default
# host on purpose - set dns.host per environment (e.g. the bind9 container's reachable address).
dns.host=
dns.port=53
dns.timeout.ms=5000
