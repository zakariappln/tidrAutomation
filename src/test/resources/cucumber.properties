# Shared Cucumber settings. Glue, features and plugins are declared per runner
# (ui.bdd.RunUiCucumberTest / api.bdd.RunApiCucumberTest) so the two layers never share glue.
# Override anything with -Dcucumber.<key>=...
cucumber.snippet-type=camelcase
cucumber.publish.quiet=true
cucumber.filter.tags=not @wip and not @blocked-env and not @out-of-scope and not @known-defect
cucumber.execution.dry-run=false
cucumber.execution.order=random
cucumber.object-factory=io.cucumber.picocontainer.PicoFactory
